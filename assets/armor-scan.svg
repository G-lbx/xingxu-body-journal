<svg xmlns="http://www.w3.org/2000/svg" width="420" height="460" viewBox="0 0 420 460" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">红金装甲扫描视图</title>
  <desc id="desc">金色面甲、红色胸甲与肩甲构成的机甲半身插画，胸口亮起冰蓝色圆形反应堆，周围带有细线扫描界面。</desc>
