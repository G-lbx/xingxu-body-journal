    <linearGradient id="silver" x1="155" y1="163" x2="242" y2="224" gradientUnits="userSpaceOnUse"><stop stop-color="#9B9FA9"/><stop offset=".28" stop-color="#373E4B"/><stop offset=".65" stop-color="#131D29"/><stop offset="1" stop-color="#73818F"/></linearGradient>
    <linearGradient id="dark" x1="144" y1="225" x2="279" y2="432" gradientUnits="userSpaceOnUse"><stop stop-color="#33313A"/><stop offset=".47" stop-color="#121923"/><stop offset="1" stop-color="#050B12"/></linearGradient>
