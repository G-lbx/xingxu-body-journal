    <linearGradient id="red" x1="104" y1="180" x2="305" y2="392" gradientUnits="userSpaceOnUse"><stop stop-color="#FF705A"/><stop offset=".2" stop-color="#C52E2B"/><stop offset=".54" stop-color="#8A171F"/><stop offset=".78" stop-color="#DC3B32"/><stop offset="1" stop-color="#510B14"/></linearGradient>
    <linearGradient id="redDark" x1="80" y1="180" x2="152" y2="407" gradientUnits="userSpaceOnUse"><stop stop-color="#E5493A"/><stop offset=".3" stop-color="#92212A"/><stop offset=".66" stop-color="#4A101C"/><stop offset="1" stop-color="#1D141C"/></linearGradient>
