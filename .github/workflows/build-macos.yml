name: Build and verify macOS apps
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: AppleSilicon
          - runner: macos-15-intel
            arch: Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install -r requirements-build.txt
      - name: Compile native OCR and create fictional fixture
        run: |
          bash scripts/build_macos_ocr.sh
          mkdir -p .qa
          swift scripts/make_ocr_fixture.swift .qa/synthetic.png
      - name: Regression tests
        run: |
          python -m unittest discover -v
          node --test test_chart.cjs
          python -c "import tkinter as tk; w=tk.Tk(); w.update(); w.destroy()"
      - name: Build app and archive
        run: bash scripts/build_macos.sh "$(command -v python)"
      - name: Verify standalone app with real Apple Vision OCR
        run: python scripts/smoke_desktop.py dist/XingxuBodyJournal.app/Contents/MacOS/XingxuBodyJournal .qa/synthetic.png
      - uses: actions/upload-artifact@v7
        with:
          name: macOS-${{ matrix.arch }}
          path: |
            dist/XingxuBodyJournal-macOS-*.zip
            dist/XingxuBodyJournal-macOS-*.zip.sha256
          if-no-files-found: error
